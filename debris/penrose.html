// Builds a kite and dart patch by deflating a "sun" of 10 half-kites, pairing the half tiles across their symmetry axes, and 4-coloring the result.
// Half-kite triangles are stored as (tip, side, obtuse), half-darts as (tip, wing, reflex). Final long edges have length 1.
function buildTiling(levels) {
  const PHI = (1 + Math.sqrt(5)) / 2, NEAR_FRACTION = 1 / (PHI * PHI), KEY_BASE = 2097152, KITE = 0, DART = 1

  for (let spoke = 0; spoke < 10; spoke++) {
    const here = 1 + spoke, there = 1 + (spoke + 1) % 10
    if (spoke % 2 === 0) triangles.push(KITE, 0, here, there)

  }
  for (let level = 0; level < levels; level++) {
    const splitCache = new Map(), nextTriangles = []
    // The new vertex on an edge sits 1/phi^2 of the way from `near` to `far`. Caching by vertex ids keeps shared vertices exact.
    const split = (near, far) => {
      const key = near * KEY_BASE + far
      let vertex = splitCache.get(key)
      if (vertex === undefined) {
        vertex = xs.length

      return vertex
    }
    for (let offset = 0; offset < triangles.length; offset += 4) {
      const tip = triangles[offset + 1], second = triangles[offset + 2], third = triangles[offset + 3]

        const onAxis = split(third, tip), onLongEdge = split(tip, second)

        const onLongEdge = split(second, tip)
        nextTriangles.push(KITE, tip, onLongEdge, third, DART, second, third, onLongEdge)
      }
    }
    triangles = nextTriangles
  }
  // Pair mirror-image halves across the axis (tip to obtuse/reflex vertex). Unpaired halves on the rim are dropped.
  const waitingHalves = new Map(), quads = [], kindList = []
  for (let offset = 0; offset < triangles.length; offset += 4) {
    const tip = triangles[offset + 1], side = triangles[offset + 2], inner = triangles[offset + 3], key = tip * KEY_BASE + inner
    const otherSide = waitingHalves.get(key)
    if (otherSide === undefined) waitingHalves.set(key, side)

      if (other === undefined) edgeOwner.set(key, tile)
      else { neighbors[tile * 4 + degree[tile]++] = other, neighbors[other * 4 + degree[other]++] = tile, edgeOwner.delete(key) }

  }
  // 4-coloring: breadth-first order from a rim tile (fewer than 4 neighbors), then color in reverse.
  // Every tile but the root is colored before its BFS parent, so at most 3 of its neighbors are already colored and a 4th color is always free.

      if (visited[root] || (pass === 0 && degree[root] === 4)) continue

      order[ordered++] = root, visited[root] = 1
      while (head < ordered) {
        const tile = order[head++]
        for (let slot = 0; slot < degree[tile]; slot++) {
          const next = neighbors[tile * 4 + slot]
          if (!visited[next]) { visited[next] = 1, order[ordered++] = next }

      }
    }

  }
