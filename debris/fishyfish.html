<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fish Eat Fish</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    // === CONSTANTS ===
    const WORLD_W = 6000, WORLD_H = 3000, MAX_LEVEL = 40, FISH_COUNT = 60, BUBBLE_COUNT = 80;
    const SHARK_COUNT = 3;
    const POWERUP_TYPES = ['speed', 'shield', 'magnet', 'frenzy', 'x2'];
    const POWERUP_DURATION = { speed: 6, shield: 8, magnet: 5, frenzy: 5, x2: 8 };
    const POWERUP_COLORS = { speed: '#44eeff', shield: '#44ff88', magnet: '#ff44ff', frenzy: '#ff4444', x2: '#ffdd00' };
    const POWERUP_ICONS = { speed: '\u26A1', shield: '\uD83D\uDEE1\uFE0F', magnet: '\uD83E\uDDF2', frenzy: '\uD83D\uDD25', x2: '\u2B50' };
    const POWERUP_NAMES = { speed: 'Speed Boost', shield: 'Shield', magnet: 'Magnet', frenzy: 'Frenzy', x2: '2x Score' };
    const MAX_POWERUPS = 6;
    const COMBO_WINDOW = 2.0; // seconds
    const VOLUME_EFFICIENCY = 0.2; // 20% of eaten volume becomes growth

    // === SKINS ===
    const SKINS = [
      { name: 'Classic', id: 'classic', req: null, desc: 'Default fish' },
      { name: 'Tiger', id: 'tiger', req: 'Eat 10 fish', check: s => s.totalEaten >= 10, desc: 'Tiger stripes' },
      { name: 'Ghost', id: 'ghost', req: 'Reach level 20', check: s => s.maxLevel >= 20, desc: 'Translucent & glowing' },
      { name: 'Golden', id: 'golden', req: 'Score 500+', check: s => s.highScore >= 500, desc: 'Shiny gold scales' },
      { name: 'Neon', id: 'neon', req: 'Get a 5x combo', check: s => s.maxCombo >= 5, desc: 'Electric neon glow' },
      { name: 'Shadow', id: 'shadow', req: 'Eat a shark', check: s => s.sharksEaten >= 1, desc: 'Dark predator look' },
      { name: 'Rainbow', id: 'rainbow', req: 'Win the game', check: s => s.wins >= 1, desc: 'Color-shifting body' },
    ];

    // === PERSISTENT STATS (localStorage) ===
    let stats = JSON.parse(localStorage.getItem('fishgame_stats') || 'null') || {
      highScore: 0, totalEaten: 0, maxLevel: 0, maxCombo: 0, sharksEaten: 0, wins: 0, gamesPlayed: 0, selectedSkin: 'classic'
    };
    function saveStats() { localStorage.setItem('fishgame_stats', JSON.stringify(stats)); }

    // === CAMERA ===
    const cam = { x: 0, y: 0 };
    function updateCamera() {
      cam.x += (player.x - canvas.width / 2 - cam.x) * 0.08;
      cam.y += (player.y - canvas.height / 2 - cam.y) * 0.08;
      cam.x = Math.max(0, Math.min(WORLD_W - canvas.width, cam.x));
      cam.y = Math.max(0, Math.min(WORLD_H - canvas.height, cam.y));
    }

    // === FISH PALETTES ===
    const FISH_PALETTES = [
      { body: '#8899aa', belly: '#aabbcc', fin: '#667788', outline: '#556677', glow: '#8899aa' },
      { body: '#2288dd', belly: '#66bbff', fin: '#1166aa', outline: '#0d4e8a', glow: '#44aaff' },
      { body: '#22bb66', belly: '#66eebb', fin: '#118844', outline: '#0a6630', glow: '#44ff88' },
      { body: '#ddcc22', belly: '#ffee77', fin: '#aa9911', outline: '#887711', glow: '#ffee44' },
      { body: '#ee7722', belly: '#ffaa66', fin: '#cc5500', outline: '#993300', glow: '#ff8844' },
      { body: '#dd3333', belly: '#ff7777', fin: '#aa1111', outline: '#880000', glow: '#ff4444' },
      { body: '#9933cc', belly: '#cc77ff', fin: '#7711aa', outline: '#550088', glow: '#bb55ff' },
      { body: '#ee44aa', belly: '#ff88cc', fin: '#cc2288', outline: '#aa0066', glow: '#ff66bb' },
      { body: '#ddeeff', belly: '#ffffff', fin: '#aabbdd', outline: '#8899bb', glow: '#ffffff' },
      { body: '#ffcc00', belly: '#ffee66', fin: '#ddaa00', outline: '#bb8800', glow: '#ffdd44' },
      { body: '#ff33ff', belly: '#ff88ff', fin: '#dd00dd', outline: '#aa00aa', glow: '#ff66ff' },
    ];
    const SIZE_SCALE = 22;
    // 40 levels spread linearly in size-space from 22px (level 1) to 220px (level 40)
    function fishSize(level) { return SIZE_SCALE * (1 + 9 * (level - 1) / (MAX_LEVEL - 1)); }
    function levelVolume(level) { const s = fishSize(level); return s * s * s; }
    function volumeToLevel(vol) {
      const s = Math.cbrt(vol);
      return Math.max(1, Math.min(MAX_LEVEL, Math.floor(1 + (s / SIZE_SCALE - 1) * (MAX_LEVEL - 1) / 9)));
    }
    // Map 40 levels to 11 palette entries
    function fishPalette(level) { return FISH_PALETTES[Math.min(10, Math.floor((level - 1) * 10 / (MAX_LEVEL - 1)))]; }

    // === EVOLUTIONS ===
    // Each evolution scales with level (player.evoLevels[id]).
    // Stats are computed dynamically via getStats(lvl).
    const ALL_EVOLUTIONS = {};
    const EVOLUTIONS = {
      3: [
        {
          id: 'tuna_fins', name: 'Tuna Fins', species: 'Bluefin Tuna',
          color: '#44eeff', category: 'SPEED',
          desc(lvl) { return `+${15+10*lvl}% top speed. Lunate caudal fin.`; },
          getStats(lvl) { return { speedMult: 1 + (0.15 + 0.10*lvl) }; }, // L1=1.25, L2=1.35, L3=1.45...
          apply(p, lvl) { /* computed dynamically */ },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['tuna_fins'] || 1;
            const spread = 0.8 + lvl * 0.1;
            ctx.fillStyle = `rgba(68,238,255,${0.25+lvl*0.05})`;
            ctx.beginPath();
            ctx.moveTo(-hw*0.6, 0);
            ctx.quadraticCurveTo(-hw*1.0, -hh*spread, -hw*1.3, -hh*(spread+0.2));
            ctx.quadraticCurveTo(-hw*1.15, 0, -hw*1.3, hh*(spread+0.2));
            ctx.quadraticCurveTo(-hw*1.0, hh*spread, -hw*0.6, 0);
            ctx.fill();
          }
        },
        {
          id: 'parrotfish_beak', name: 'Parrotfish Beak', species: 'Humphead Parrotfish',
          color: '#88ff88', category: 'GROWTH',
          desc(lvl) { return `+${20+10*lvl}% volume absorbed per eat.`; },
          getStats(lvl) { return { volumeAbsorbMult: 1 + (0.20 + 0.10*lvl) }; }, // L1=1.3, L2=1.4, L3=1.5...
          apply(p, lvl) { /* computed dynamically */ },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['parrotfish_beak'] || 1;
            ctx.strokeStyle = `rgba(255,255,240,${0.5+lvl*0.1})`;
            ctx.lineWidth = 2 + lvl*0.5;
            ctx.beginPath();
            ctx.moveTo(hw*0.85, -hh*(0.12+lvl*0.02));
            ctx.quadraticCurveTo(hw*(1.0+lvl*0.03), -hh*0.05, hw*(1.0+lvl*0.02), 0);
            ctx.quadraticCurveTo(hw*(1.0+lvl*0.03), hh*0.05, hw*0.85, hh*(0.12+lvl*0.02));
            ctx.stroke();
          }
        }
      ],
      4: [
        {
          id: 'lateral_line', name: 'Lateral Line', species: 'Hammerhead Shark',
          color: '#aaddff', category: 'UTILITY',
          desc(lvl) { return `Minimap shows fish (green/red). Threat ring ${400+100*lvl}px.`; },
          getStats(lvl) { return { lateralRange: 400 + 100*lvl }; }, // L1=500, L2=600...
          apply(p, lvl) { p.hasLateralLine = true; },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['lateral_line'] || 1;
            ctx.strokeStyle = `rgba(170,221,255,${0.3+lvl*0.08+Math.sin(t*4)*0.15})`;
            ctx.lineWidth = 1 + lvl*0.3;
            ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(-hw*0.6, 0); ctx.lineTo(hw*0.7, 0); ctx.stroke();
            ctx.setLineDash([]);
          }
        },
        {
          id: 'anglerfish_lure', name: 'Anglerfish Lure', species: 'Deep-sea Anglerfish',
          color: '#ffee44', category: 'UTILITY',
          desc(lvl) { return `Lure attracts fish ${lvl+1} levels below. Range ${150+50*lvl}px.`; },
          getStats(lvl) { return { lureRange: 150 + 50*lvl, lureLevels: lvl + 1 }; }, // L1: 2 lvls 200px, L2: 3 lvls 250px...
          apply(p, lvl) { p.hasLure = true; },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['anglerfish_lure'] || 1;
            const orbSize = 4 + lvl;
            const glow = 0.5 + Math.sin(t*6)*0.3;
            ctx.strokeStyle = `rgba(255,238,68,${0.4+lvl*0.08})`;
            ctx.lineWidth = 1 + lvl*0.3;
            ctx.beginPath();
            ctx.moveTo(hw*0.4, -hh*0.7);
            ctx.quadraticCurveTo(hw*0.7, -hh*1.2, hw*0.8, -hh*0.5);
            ctx.stroke();
            ctx.fillStyle = `rgba(255,238,68,${glow})`;
            ctx.beginPath(); ctx.arc(hw*0.8, -hh*0.5, orbSize+Math.sin(t*8)*1.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = `rgba(255,255,200,${glow*0.3})`;
            ctx.beginPath(); ctx.arc(hw*0.8, -hh*0.5, orbSize*2.5, 0, Math.PI*2); ctx.fill();
          }
        }
      ],
      5: [
        {
          id: 'porcupinefish_spines', name: 'Porcupinefish Spines', species: 'Porcupinefish',
          color: '#ffaa44', category: 'DEFENSE',
          desc(lvl) { return `Auto-block hit every ${Math.max(5, 20-3*lvl)}s. Stun ${1+0.5*lvl}s.`; },
          getStats(lvl) { return { spineCooldown: Math.max(5, 20 - 3*lvl), spineStun: 1 + 0.5*lvl }; }, // L1: 17s/1.5s, L2: 14s/2s...
          apply(p, lvl) { p.hasSpines = true; if (p.spineTimer > 0) p.spineTimer = Math.min(p.spineTimer, Math.max(5, 20-3*lvl)); },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['porcupinefish_spines'] || 1;
            const stats = ALL_EVOLUTIONS['porcupinefish_spines'].getStats(lvl);
            const charged = player.spineTimer <= 0;
            const alpha = charged ? 0.6+lvl*0.06 : 0.25;
            ctx.strokeStyle = `rgba(255,170,68,${alpha})`;
            ctx.lineWidth = 1.5 + lvl*0.3;
            const spineCount = 8 + lvl*2;
            for (let i = 0; i < spineCount; i++) {
              const angle = (i / spineCount) * Math.PI * 2;
              const baseX = Math.cos(angle) * hw * 0.9;
              const baseY = Math.sin(angle) * hh * 0.9;
              const ext = charged ? 1.25 + lvl*0.05 : 1.1;
              const tipX = Math.cos(angle) * hw * ext;
              const tipY = Math.sin(angle) * hh * ext;
              ctx.beginPath(); ctx.moveTo(baseX, baseY); ctx.lineTo(tipX, tipY); ctx.stroke();
              if (charged) {
                ctx.fillStyle = `rgba(255,200,100,${0.5+Math.sin(t*5+i)*0.2})`;
                ctx.beginPath(); ctx.arc(tipX, tipY, 1.5+lvl*0.3, 0, Math.PI*2); ctx.fill();
              }
            }
          }
        },
        {
          id: 'octopus_ink', name: 'Octopus Ink Cloud', species: 'Common Octopus',
          color: '#9944cc', category: 'ESCAPE',
          isActive: true,
          desc(lvl) { return `Ink scatters fish ${250+50*lvl}px. +${40+10*lvl}% speed ${1.5+0.5*lvl}s. ${Math.max(6, 15-2*lvl)}s CD.`; },
          getStats(lvl) { return { inkRadius: 250+50*lvl, inkSpeedBoost: 1+(0.40+0.10*lvl), inkSpeedDur: 1.5+0.5*lvl, inkCooldown: Math.max(6, 15-2*lvl) }; },
          apply(p, lvl) {
            p.hasInk = true; p.inkCooldown = 0;
            const existing = p.activeAbilities.find(a=>a.id==='octopus_ink');
            const cd = ALL_EVOLUTIONS['octopus_ink'].getStats(lvl).inkCooldown;
            if (existing) { existing.maxCooldown = cd; }
            else { p.activeAbilities.push({id:'octopus_ink', cooldownProp:'inkCooldown', maxCooldown:cd}); }
          },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['octopus_ink'] || 1;
            ctx.fillStyle = `rgba(100,30,160,${0.35+lvl*0.06+Math.sin(t*3)*0.1})`;
            ctx.beginPath(); ctx.ellipse(hw*-0.1, hh*0.6, hw*(0.2+lvl*0.03), hh*(0.18+lvl*0.02), 0, 0, Math.PI*2); ctx.fill();
          }
        }
      ],
      6: [
        {
          id: 'electric_shock', name: 'Electric Eel Shock', species: 'Electric Eel',
          color: '#ffcc00', category: 'OFFENSE',
          isActive: true,
          desc(lvl) { return `Shock ${150+50*lvl}px. Stun ${1.5+0.5*lvl}s. Sharks ${0.3+0.2*lvl}s. ${Math.max(4, 10-1.5*lvl)}s CD.`; },
          getStats(lvl) { return { shockRadius: 150+50*lvl, shockStun: 1.5+0.5*lvl, shockSharkStun: 0.3+0.2*lvl, shockCooldown: Math.max(4, 10-1.5*lvl) }; },
          apply(p, lvl) {
            p.hasShock = true; p.electricCooldown = 0;
            const existing = p.activeAbilities.find(a=>a.id==='electric_shock');
            const cd = ALL_EVOLUTIONS['electric_shock'].getStats(lvl).shockCooldown;
            if (existing) { existing.maxCooldown = cd; }
            else { p.activeAbilities.push({id:'electric_shock', cooldownProp:'electricCooldown', maxCooldown:cd}); }
          },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['electric_shock'] || 1;
            ctx.fillStyle = `rgba(255,200,0,${0.2+lvl*0.06+Math.sin(t*4)*0.1})`;
            ctx.beginPath(); ctx.ellipse(hw*0.1, -hh*0.5, hw*(0.25+lvl*0.04), hh*(0.12+lvl*0.02), 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(hw*0.1, hh*0.5, hw*(0.25+lvl*0.04), hh*(0.12+lvl*0.02), 0, 0, Math.PI*2); ctx.fill();
            if (player.electricCooldown <= 0) {
              ctx.strokeStyle = `rgba(255,255,100,${0.25+lvl*0.06+Math.sin(t*10)*0.2})`;
              ctx.lineWidth = 1 + lvl*0.3;
              for (let a = 0; a < lvl+1; a++) {
                const yOff = -hh*0.3 + a*hh*0.15;
                ctx.beginPath();
                ctx.moveTo(-hw*0.3, yOff);
                ctx.lineTo(-hw*0.1, yOff+Math.sin(t*12+a)*3);
                ctx.lineTo(hw*0.1, yOff-hh*0.05+Math.cos(t*14+a)*3);
                ctx.lineTo(hw*0.3, yOff+Math.sin(t*11+a)*2);
                ctx.stroke();
              }
            }
          }
        },
        {
          id: 'barracuda_jaw', name: 'Barracuda Jaw', species: 'Great Barracuda',
          color: '#cc4444', category: 'OFFENSE',
          desc(lvl) { return `+${30+10*lvl}% eating range. +${20+10*lvl}% burst ${0.8+0.2*lvl}s on eat.`; },
          getStats(lvl) { return { eatingRangeMult: 1 + (0.30 + 0.10*lvl), burstSpeedMult: 1 + (0.20+0.10*lvl), burstDuration: 0.8+0.2*lvl }; },
          apply(p, lvl) { p.hasBarracudaJaw = true; p.burstTimer = 0; },
          drawVisual(ctx, hw, hh, t) {
            const lvl = player.evoLevels['barracuda_jaw'] || 1;
            const teethCount = 3 + lvl;
            ctx.strokeStyle = `rgba(200,200,200,${0.5+lvl*0.08})`;
            ctx.lineWidth = 1.5 + lvl*0.3;
            ctx.beginPath();
            ctx.moveTo(hw*0.7, hh*(0.18+lvl*0.02));
            ctx.lineTo(hw*(0.98+lvl*0.02), hh*0.15);
            ctx.lineTo(hw*0.7, hh*0.05);
            ctx.stroke();
            ctx.fillStyle = `rgba(255,255,255,${0.4+lvl*0.06})`;
            for (let i = 0; i < teethCount; i++) {
              const tx = hw*0.72 + i*hw*(0.28/teethCount);
              ctx.beginPath();
              ctx.moveTo(tx, hh*0.05);
              ctx.lineTo(tx+2, hh*(0.13+lvl*0.01));
              ctx.lineTo(tx-2, hh*(0.11+lvl*0.01));
              ctx.closePath(); ctx.fill();
            }
          }
        }
      ]
    };
    // Index all evolutions by ID + build flat list
    const ALL_EVOS_LIST = [];
    for (const lvl in EVOLUTIONS) for (const evo of EVOLUTIONS[lvl]) { ALL_EVOLUTIONS[evo.id] = evo; ALL_EVOS_LIST.push(evo); }

    // Helper: get current stats for an evolution the player has
    function evoStats(id) {
      const evo = ALL_EVOLUTIONS[id];
      if (!evo || !player.evoLevels[id]) return null;
      return evo.getStats(player.evoLevels[id]);
    }

    // Pool-based upgrade selection: 2 choices (new ability or level-up existing)
    function generateUpgradeChoices() {
      const newAbilities = ALL_EVOS_LIST.filter(e => !player.evoLevels[e.id]);
      const existing = ALL_EVOS_LIST.filter(e => player.evoLevels[e.id] > 0);
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      let c1, c2;
      if (newAbilities.length > 0 && existing.length > 0) {
        // One new, one existing — breadth vs depth
        c1 = pick(newAbilities);
        c2 = pick(existing);
      } else if (newAbilities.length >= 2) {
        // Early game: two new
        c1 = pick(newAbilities);
        c2 = pick(newAbilities.filter(e => e.id !== c1.id));
      } else if (existing.length >= 2) {
        // All unlocked: two existing to level up (lowest levels first)
        const sorted = [...existing].sort((a,b) => (player.evoLevels[a.id]||0) - (player.evoLevels[b.id]||0));
        // Pick from the bottom half for variety
        const pool = sorted.slice(0, Math.max(2, Math.ceil(sorted.length * 0.6)));
        c1 = pick(pool);
        c2 = pick(pool.filter(e => e.id !== c1.id));
      } else if (existing.length === 1) {
        c1 = existing[0];
        c2 = newAbilities.length > 0 ? pick(newAbilities) : existing[0];
      } else {
        return null;
      }
      return [c1, c2];
    }

    // === INPUT ===
    const keys = {};
    const justPressed = {};
    window.addEventListener('keydown', e => {
      if (!keys[e.key]) justPressed[e.key] = true;
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // === TOUCH / MOUSE INPUT ===
    let abilityButtonRects = []; // [{x,y,w,h,key}] populated by drawHUD
    let moveTarget = null; // {x, y} in world coords, or null
    let touchActive = false;
    let lastTapTime = 0;
    let tapPos = null; // screen coords of most recent tap (for menu clicks)

    function screenToWorld(sx, sy) { return { x: sx + cam.x, y: sy + cam.y }; }

    function handlePointerStart(sx, sy) {
      resumeAudio();
      tapPos = { x: sx, y: sy };

      // If on win screen, tap to restart
      if (gameState === 'win') { restart(); return; }

      // If skin menu is open, check for skin row taps or close
      if (skinMenuOpen) {
        const menuW = 420, menuH = SKINS.length * 50 + 80;
        const mx = canvas.width/2 - menuW/2, my = canvas.height/2 - menuH/2;
        // Check if tap is inside menu
        if (sx >= mx && sx <= mx+menuW && sy >= my && sy <= my+menuH) {
          for (let i = 0; i < SKINS.length; i++) {
            const rowY = my + 70 + i * 50;
            if (sy >= rowY && sy <= rowY + 42) {
              const skin = SKINS[i];
              if (!skin.check || skin.check(stats)) {
                stats.selectedSkin = skin.id;
                saveStats();
                addNotification(`Skin: ${skin.name}`, '#4af');
              } else {
                addNotification(`Locked: ${skin.req}`, '#884');
              }
              return;
            }
          }
        }
        // Tap outside menu closes it
        skinMenuOpen = false;
        return;
      }

      // If choosing upgrade, check for card taps
      if (gameState === 'choosing_upgrade' && upgradeChoices) {
        const menuW = 560, menuH = 320;
        const mmx = canvas.width/2 - menuW/2, mmy = canvas.height/2 - menuH/2;
        for (let c = 0; c < 2; c++) {
          const evo = upgradeChoices[c];
          if (!evo) continue;
          const cardW = 230, cardH = 200;
          const cx = mmx + 30 + c * (cardW + 30);
          const cy = mmy + 75;
          if (sx >= cx && sx <= cx+cardW && sy >= cy && sy <= cy+cardH) {
            const newLvl = (player.evoLevels[evo.id] || 0) + 1;
            player.evoLevels[evo.id] = newLvl;
            if (!player.evolutions.includes(evo.id)) player.evolutions.push(evo.id);
            evo.apply(player, newLvl);
            const lvlTag = newLvl > 1 ? ` Lv${newLvl}` : '';
            addNotification(`${evo.name}${lvlTag} acquired!`, evo.color);
            upgradeChoices = null;
            gameState = 'playing';
            return;
          }
        }
        return;
      }

      // Normal gameplay
      if (gameState === 'playing') {
        // Tap ability buttons
        for (const btn of abilityButtonRects) {
          if (sx >= btn.x && sx <= btn.x + btn.w && sy >= btn.y && sy <= btn.y + btn.h) {
            justPressed[btn.key] = true;
            return;
          }
        }
        // Tap skin button (bottom-right corner)
        if (sx > canvas.width - 160 && sy > canvas.height - 40) {
          skinMenuOpen = !skinMenuOpen;
          return;
        }
        // Set move target
        const w = screenToWorld(sx, sy);
        moveTarget = w;
        touchActive = true;
      }
    }

    function handlePointerMove(sx, sy) {
      if (touchActive && gameState === 'playing') {
        moveTarget = screenToWorld(sx, sy);
      }
    }

    function handlePointerEnd() {
      touchActive = false;
      moveTarget = null;
    }

    // Touch events
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      handlePointerStart(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
